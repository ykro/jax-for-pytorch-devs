      #d-01-eager-vs-jit-root .scroll-hint { display: none; margin: 1rem 0 0; font-size: 0.8125rem; color: var(--color-muted); }
      #d-01-eager-vs-jit-root .scroll-hint { display: block; }
      #d-01-eager-vs-jit-root .diagram-container { overflow-x: visible; }</style>
