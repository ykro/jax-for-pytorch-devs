        <title id="eager-vs-jit-title">Eager kernel dispatch vs @jax.jit XLA fusion</title>
        <desc id="eager-vs-jit-desc">Architecture delta comparing eager operator-by-operator dispatch with intermediate HBM roundtrips against a single XLA-fused PJRT kernel under @jax.jit.</desc>
